[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sierpinski"
version = "1.0.0"
description = "Trójkąt Sierpińskiego w odcieniach fioletu, PNG bez zależności"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sierpinski = "sierpinski.__main__:main"

[tool.setuptools]
packages = ["sierpinski"]
